name: release
on:
  push:
    tags:
      - "v*"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build binaries (patched, pinned upstream mofid commit)
        run: bash ci/build_binaries.sh
      - name: Build wheel
        run: bash ci/build_wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Java (runtime dependency for Systre)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq default-jre-headless
      - run: pip install dist/*.whl pytest
      - run: pytest -v tests/

  github-release:
    # Attaches the tested wheel to the GitHub release, so pip can install it by
    # URL. Deliberately independent of `publish`: a PyPI upload that fails (e.g.
    # a missing trusted publisher) must not keep the wheel from being available.
    needs: test-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to attach assets to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) -- no stored secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
